<!doctype html><html lang='pt-BR'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Lumi</title><style>:root{--bg:#10051e;--violet:#9d5cff;--blue:#57c9ff;--ink:#fbf8ff;--muted:#d9ceec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 2%,#482184,transparent 35%),radial-gradient(circle at 100% 35%,#0e4f70,transparent 40%),var(--bg);color:var(--ink);font:16px Arial,sans-serif}.app{width:min(680px,100%);margin:auto;padding:24px 16px 104px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:800;font-size:22px}.spark{color:var(--violet)}.tag{border:1px solid #ffffff35;border-radius:20px;padding:7px 10px;color:var(--muted);font-size:12px}h1{font-size:28px;line-height:1.12;margin:18px 0 8px}h1 b{color:#b791ff}.intro{color:var(--muted);margin:0 0 22px;line-height:1.45}.quick{display:flex;gap:8px;overflow:auto;padding:4px 0 16px}.quick button,.tool{border:1px solid #ffffff2f;background:#271343;color:var(--ink);border-radius:16px;padding:10px 12px;white-space:nowrap;font-weight:700;cursor:pointer}.quick button:hover,.tool:hover{border-color:var(--blue)}#chat{display:flex;flex-direction:column;gap:10px;min-height:240px}.msg{max-width:88%;padding:12px 14px;border-radius:17px;line-height:1.45;white-space:pre-wrap}.l{align-self:flex-start;background:#261344;border:1px solid #ffffff18}.u{align-self:flex-end;background:linear-gradient(135deg,#7252e9,#2a7bd4)}.listen{display:block;margin-top:8px;background:#17385e;color:#ecf7ff;border:1px solid #8dcbff55;border-radius:10px;padding:6px 9px;font-weight:700;font-size:12px}.status{height:24px;color:#c8b7eb;font-size:13px;padding:7px 2px;visibility:hidden}.status.on{visibility:visible}.bar{position:fixed;bottom:0;left:0;right:0;background:#150a27ed;backdrop-filter:blur(12px);border-top:1px solid #ffffff18;padding:10px}.compose{width:min(680px,100%);margin:auto;display:flex;align-items:center;gap:8px}.compose input{min-width:0;flex:1;background:#24123f;border:1px solid #a87cff;border-radius:22px;color:#fff;padding:14px 15px;font-size:16px;outline:none}.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--violet);color:#fff;font-size:18px;cursor:pointer}.round.alt{background:#1c496f}.notice{margin:12px 0;padding:10px 12px;border-radius:12px;background:#14365388;border:1px solid #73c9ff44;color:#d8f2ff;font-size:13px;line-height:1.4}.hide{display:none}@media(max-width:450px){h1{font-size:25px}.app{padding-top:18px}}</style><main class='app'><header class='top'><div class='brand'><span class='spark'>✦</span> Lumi</div><div class='tag'>Criadora IA</div></header><h1>Oi, <b>pessoal.</b><br>O que precisa ser resolvido?</h1><p class='intro'>Eu converso, ensino, ajudo com ideias e continuo o assunto sem te fazer repetir tudo.</p><div class='quick'><button data-q='Me explica uma coisa'>Explicar algo</button><button data-q='Quero criar um aplicativo'>Criar projeto</button><button data-q='Preciso de um conselho'>Conversar</button><button data-q='Me ajuda a aprender a ler'>Aprender a ler</button></div><div class='notice' id='notice'>A Lumi usa um cérebro online quando ele estiver configurado. Sem ele, ela mantém as respostas básicas e seguras.</div><section id='chat' aria-live='polite'></section><div class='status' id='status'>Lumi está pensando...</div></main><div class='bar'><form class='compose' id='form'><label class='tool' for='photo'>＋<input id='photo' type='file' accept='image/*' class='hide'></label><input id='input' autocomplete='off' placeholder='Converse com a Lumi'><button class='round alt' type='button' id='mic' aria-label='Falar'>♩</button><button class='round' aria-label='Enviar'>➜</button></form></div><script>const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#input'),status=document.querySelector('#status'),mic=document.querySelector('#mic'),photo=document.querySelector('#photo');const API=String(window.LUMI_CHAT_API_URL||'').replace(/\/$/,'');const TOKEN=String(window.LUMI_ACCESS_TOKEN||'');const KEY='lumi_conversa';const get=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};const save=x=>localStorage.setItem(KEY,JSON.stringify(x.slice(-24)));function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.96;window.speechSynthesis.speak(u)}function add(t,kind='l',store=true){let d=document.createElement('div');d.className='msg '+kind;d.textContent=t;if(kind==='l'){let b=document.createElement('button');b.className='listen';b.type='button';b.textContent='🔊 Ouvir resposta';b.onclick=()=>speak(t);d.append(b)}chat.append(d);if(store){let h=get();h.push({role:kind==='u'?'user':'assistant',content:t});save(h)}window.scrollTo(0,document.body.scrollHeight)}function local(q){let t=q.toLowerCase();if(/ler|silaba|letra/.test(t))return 'Vamos aprender juntos. Escolhe uma palavra curta, como casa ou bola, e eu separo em sílabas com você.';if(/conselho|triste|medo|ansioso/.test(t))return 'Pode conversar comigo. Me conta o que aconteceu e a gente pensa num próximo passo com calma.';if(/site|app|projeto|criar/.test(t))return 'Boa ideia. Me diga para quem é e o que a pessoa precisa fazer. Eu organizo a primeira versão.';if(/foto|imagem/.test(t))return 'Pode enviar a foto e dizer o que você quer criar ou entender com ela.';return 'Entendi. Me conta um pouco mais do objetivo para eu te ajudar melhor.'}async function reply(q,h){if(!API)return local(q);let heads={'Content-Type':'application/json'};if(TOKEN)heads.Authorization='Bearer '+TOKEN;try{let r=await fetch(API+'/chat',{method:'POST',headers:heads,body:JSON.stringify({message:q,history:h})}),d=await r.json();if(!r.ok||!d.reply)throw Error();document.querySelector('#notice').classList.add('hide');return d.reply}catch(e){return local(q)}}async function send(q){q=String(q||'').trim();if(!q)return;let h=get();add(q,'u');input.value='';status.classList.add('on');try{add(await reply(q,h),'l')}finally{status.classList.remove('on')}}form.onsubmit=e=>{e.preventDefault();send(input.value)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q));photo.onchange=()=>{if(photo.files[0])add('Recebi a foto como referência. O que você quer que eu observe ou ajude a criar?')};let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(R)mic.onclick=()=>{let r=new R();r.lang='pt-BR';status.textContent='Lumi está ouvindo...';status.classList.add('on');r.onresult=e=>{input.value=e.results[0][0].transcript;input.focus()};r.onend=()=>{status.textContent='Lumi está pensando...';status.classList.remove('on')};r.start()};else mic.onclick=()=>add('Seu navegador não liberou o microfone. Você pode escrever normalmente.');let old=get();if(old.length)old.forEach(x=>add(x.content,x.role==='user'?'u':'l',false));else add('Oi. Eu sou a Lumi. O que vamos criar ou resolver hoje?','l',false)</script></html>
