<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumi 2.0</title><style>:root{--bg:#10051e;--v:#9d5cff;--b:#57c9ff;--ink:#fbf8ff;--muted:#d3c8ea;--line:#ffffff20}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,#482184,transparent 36%),radial-gradient(circle at 100% 32%,#0e4f70,transparent 40%),var(--bg);font:16px Arial,sans-serif;color:var(--ink)}.app{max-width:680px;margin:auto;padding:20px 14px 104px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:9px;align-items:center;font-weight:bold}.star{display:grid;place-items:center;width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,var(--v),var(--b));box-shadow:0 0 25px #a86cff}.headbutton,.tag{font-size:12px;padding:7px 10px;border-radius:18px;border:1px solid var(--line);color:#e9e0ff;background:#ffffff0d}.hero,.chatbox,.panel{background:#1c0d33d9;border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(14px)}.hero{margin:17px 0;padding:22px;text-align:center}.orb{width:118px;height:118px;margin:auto;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#8d54ff33,transparent 68%);box-shadow:0 0 0 11px #a474ff22,0 0 38px #61cfff99}.orb img{width:108px;height:108px;object-fit:contain;filter:drop-shadow(0 0 11px #61cfffaa);animation:spin 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.orb img{animation:none}}.hero h1{margin:13px 0 7px;font-size:25px}.hero p{margin:0;color:var(--muted);line-height:1.45}.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:17px}.quick button,.ask button{color:#f7f2ff;border:1px solid #aa86ff66;background:#351b5c;padding:9px 11px;border-radius:18px;font-weight:bold}.chatbox{padding:13px;min-height:260px}.chat{display:flex;flex-direction:column;gap:10px}.msg{max-width:88%;padding:12px 13px;border-radius:18px;line-height:1.4}.bot{align-self:flex-start;background:#2c1950}.me{align-self:flex-end;background:#165276}.ask{position:fixed;bottom:0;left:0;right:0;background:#10051ef2;border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;justify-content:center}.ask input{width:min(500px,66vw);border:1px solid var(--line);border-radius:20px;padding:12px;background:#ffffff0d;color:white}.panel{margin-top:14px;padding:15px;color:var(--muted);font-size:14px}.panel b{color:white}</style><main class="app"><header class="top"><div class="brand"><div class="star">✦</div><span>Lumi</span></div><span class="tag">IA criadora</span></header><section class="hero"><div class="orb"><img id="avatar" alt="Avatar da Lumi girando"></div><h1>Oi, eu sou a Lumi</h1><p>Posso conversar, ensinar e ajudar você a criar ideias.</p><div class="quick"><button onclick="send('Me ajuda com uma ideia')">Criar uma ideia</button><button onclick="send('Quero aprender algo')">Aprender</button></div></section><section class="chatbox"><div id="chat" class="chat"><div class="msg bot">Oi! O que você quer criar ou resolver hoje?</div></div></section><section class="panel"><b>Espaço seguro:</b> não compartilhe senhas, endereço ou dados pessoais. Conteúdos que envolvem exploração ou abuso de menores são bloqueados.</section></main><form class="ask" onsubmit="send();return false"><input id="text" placeholder="Escreva para a Lumi..." autocomplete="off"><button>Enviar</button></form><script>const avatar=document.getElementById('avatar');avatar.src='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><defs><radialGradient id="g"><stop stop-color="%238feaff"/><stop offset=".48" stop-color="%234f43e6"/><stop offset="1" stop-color="%23120d62"/></radialGradient><linearGradient id="r"><stop stop-color="%230defff"/><stop offset="1" stop-color="%23c041ff"/></linearGradient></defs><circle cx="90" cy="90" r="65" fill="url(%23g)"/><path d="M8 96c36 42 128 42 164 0" fill="none" stroke="url(%23r)" stroke-width="12"/><circle cx="63" cy="82" r="10" fill="%23dffbff"/><circle cx="117" cy="82" r="10" fill="%23dffbff"/><path d="M68 112q22 22 44 0" fill="none" stroke="%23dffbff" stroke-width="8" stroke-linecap="round"/></svg>');function send(p){const i=document.getElementById('text'),t=p||i.value.trim();if(!t)return;document.getElementById('chat').insertAdjacentHTML('beforeend','<div class="msg me"></div><div class="msg bot">Entendi. Estou aqui para ajudar você com isso.</div>');document.querySelector('.msg.me:last-of-type').textContent=t;i.value='';document.getElementById('chat').lastElementChild.scrollIntoView({behavior:'smooth'})}</script></html>
