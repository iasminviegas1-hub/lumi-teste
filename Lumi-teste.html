<!doctype html><html lang='pt-BR'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Lumi · Criadora IA</title><style>:root{--v:#08754f;--e:#064d3d;--g:#d4af37}*{box-sizing:border-box}body{margin:0;background:#e8f4eb;color:#163a2c;font:16px Arial,sans-serif}.app{max-width:620px;margin:auto;padding:18px 14px 92px}.top{display:flex;justify-content:space-between;font-weight:bold}.tag{background:var(--g);color:#fff;padding:6px 10px;border-radius:18px;font-size:12px}.hero{display:flex;gap:14px;align-items:center;padding:18px;margin:16px 0;border-radius:22px;background:linear-gradient(135deg,var(--e),var(--v));color:#fff}.av{font-size:52px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;line-height:1.35}.chat{min-height:315px;display:flex;flex-direction:column;gap:9px}.msg{max-width:92%;padding:12px;border-radius:15px;line-height:1.45;white-space:pre-wrap}.l{background:#fff;border:1px solid #d4e6da}.u{background:var(--v);color:#fff;align-self:flex-end}.read{border:0;background:#e5f4ea;color:#075d40;border-radius:9px;padding:7px 10px;margin-top:8px;font-weight:bold;font-size:14px}.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.quick button{background:#fff;border:1px solid #b5d1bf;border-radius:18px;padding:9px 11px;font-weight:bold;color:#163a2c}.hint{font-size:13px;color:#547264}.form{position:fixed;bottom:0;left:0;right:0;display:flex;gap:7px;padding:11px;background:#fff;border-top:1px solid #cde0d3}.form input{flex:1;min-width:0;padding:12px;border:1px solid #b5d1bf;border-radius:10px;font-size:16px}.form button{border:0;border-radius:10px;padding:0 14px;background:var(--v);color:#fff;font-weight:bold}.mic{font-size:20px;min-width:47px}.mic.on{background:#bd2635}.card{background:#f8fbff;border:1px solid #cfe0f3;border-radius:13px;padding:12px;margin-top:5px;white-space:normal}.card b{display:block;font-size:18px;color:#14558a}.card p{margin:7px 0}.card a{display:inline-block;text-decoration:none;background:#14558a;color:#fff;border-radius:8px;padding:9px 11px;font-weight:bold}</style><body><main class='app'><header class='top'><b>Lumi · Criadora IA</b><span class='tag'>Assistente IA</span></header><section class='hero'><div class='av'>👩🏽</div><div><h1>Oi, eu sou a Lumi.</h1><p>Converso, ensino, aconselho e crio ideias para testar.</p></div></section><section id='chat' class='chat'></section><div class='quick'><button data-q='O que você consegue fazer?'>O que você faz?</button><button data-q='Você faz contas?'>Fazer contas</button><button data-q='Preciso de um conselho'>Conselho</button><button data-q='Me ensine a ler'>Aprender a ler</button><button data-q='Crie um site'>Criar site</button><button data-q='Crie um aplicativo'>Criar app</button></div><p class='hint'>Toque no microfone para falar. Toque em Ouvir resposta para a Lumi ler.</p></main><form class='form' id='form'><button type='button' class='mic' id='mic' aria-label='Falar com a Lumi'>🎤</button><input id='input' placeholder='Escreva ou fale sua ideia'><button>Enviar</button></form><script>const c=document.querySelector('#chat'),i=document.querySelector('#input'),mic=document.querySelector('#mic'),base='https://htmlpreview.github.io/?https://github.com/iasminviegas1-hub/lumi-teste/blob/main/';let rec;function ouvir(t){if(!('speechSynthesis'in window)){alert('Este celular não tem leitura em voz disponível neste navegador.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.93;speechSynthesis.speak(u)}function add(t,k='l',ler=true){let d=document.createElement('div');d.className='msg '+k;let x=document.createElement('span');x.textContent=t;d.appendChild(x);if(k==='l'&&ler){let b=document.createElement('button');b.className='read';b.textContent='🔊 Ouvir resposta';b.onclick=()=>ouvir(t);d.appendChild(document.createElement('br'));d.appendChild(b)}c.appendChild(d);window.scrollTo(0,document.body.scrollHeight)}function project(t,desc,file){let d=document.createElement('div');d.className='msg l';d.innerHTML='<div class=card><b>'+t+'</b><p>'+desc+'</p><a target=_blank rel=noopener href=\''+base+file+'\'>Abrir projeto para testar</a></div>';let b=document.createElement('button');b.className='read';b.textContent='🔊 Ouvir resposta';b.onclick=()=>ouvir(t+'. '+desc);d.appendChild(b);c.appendChild(d)}function idade(){let dias=Math.max(0,Math.floor((Date.now()-new Date('2026-11-04T00:00:00-03:00'))/86400000));return dias?'Tenho '+dias+' dia'+(dias===1?'':'s')+' de idade.':'Fui criada hoje e ainda tenho menos de um dia de idade.'}function conta(q){let t=q.toLowerCase().replaceAll(',','.');let p=t.match(/(\d+(?:\.\d+)?)\s*%\s*(?:de|do)\s*(\d+(?:\.\d+)?)/);if(p)return+p[1]*+p[2]/100;t=t.replace(/quanto é|quanto da|qual é|calcule|faz|faça|por favor|\?/g,' ').replace(/multiplicado por|vezes| x /g,'*').replace(/dividido por/g,'/').replace(/mais/g,'+').replace(/menos/g,'-').replace(/[^0-9.+*/() -]/g,'');if(!t||!/^[0-9.+*/() -]+$/.test(t))return null;try{let z=Function('return ('+t+')')();return Number.isFinite(z)?z:null}catch(e){return null}}function r(q){let t=q.toLowerCase();if(/o que.*(faz|consegue)|suas? habilidade|pode.*fazer/.test(t))return 'Eu converso, dou conselhos, ensino a ler passo a passo, faço contas, explico dúvidas e crio modelos de sites, portais e aplicativos para testar. Se a ideia estiver meio embolada, eu ajudo a organizar.';if(/faz.*cont|consegue.*cont|sabe.*cont/.test(t))return 'Consigo, sim. Pode mandar uma conta como 25 vezes 4, 10% de 300 ou 45 dividido por 5.';if(/total.*notícia|portal.*notícia|site.*notícia/.test(t))return 'NOTICIAS';if(/cria|crie|fazer|faça|quero|preciso/.test(t)&&/(aplicativo| app|app$)/.test(t))return 'APP';if(/cria|crie|fazer|faça|quero|preciso/.test(t)&&/(site|página|pagina|loja|blog|portal)/.test(t))return 'SITE';if(/quem.*(você|tu)|sua idade|quantos anos|quando.*(criada|nasceu)|criador|idealizador/.test(t))return 'Eu sou a Lumi, da Criadora IA. Fui criada em Porto Alegre, Brasil, em 4 de novembro de 2026. '+idade()+' A Criadora IA foi criada e idealizada por Douglas Resendeiras.';if(/nome.*(pessoa|amigo|alguém)|dados.*(pessoa|amigo|alguém)|endereço|telefone.*(dele|dela)/.test(t))return 'Eu não revelo, invento nem procuro dados pessoais de outras pessoas.';if(/conselho|triste|ansioso|ansiosa|briga|problema|ajuda.*vida|não sei o que fazer/.test(t))return 'Claro. Me conta com calma o que aconteceu e o que você gostaria que melhorasse. A gente pensa em um passo de cada vez, sem julgamento.';if(/ensina.*(ler|leitura)|aprender.*(ler|leitura)|não sei ler/.test(t))return 'Vamos devagar. CASA é CA mais SA. Leia comigo: CA-SA. Agora tente BOLA: BO-LA. Se quiser, eu preparo mais palavras no seu ritmo.';let z=conta(q);if(z!==null)return 'A conta dá '+(Number.isInteger(z)?z:String(Math.round(z*100)/100).replace('.',','))+'.';return 'Entendi o que você disse. Posso conversar, dar conselho, explicar uma dúvida, fazer uma conta, ensinar a ler ou criar um site e aplicativo. Por onde quer começar?'}function enviar(q){if(!q.trim())return;add(q,'u',false);setTimeout(()=>{let z=r(q);if(z==='NOTICIAS'){add('Preparei o modelo do Total de Notícias com link para testar.');project('Total de Notícias','Portal para Porto Alegre e região, com alertas, matérias e área de envio.','total-de-noticias.html')}else if(z==='APP'){add('Preparei um modelo de aplicativo para você abrir e testar no celular.');project('Meu Aplicativo','Tela inicial, navegação e áreas principais prontas para virar projeto.','aplicativo-criado.html')}else if(z==='SITE'){add('Preparei uma página de exemplo para você testar. Depois você me diz o nome e o tipo de negócio para eu personalizar.');project('Meu novo site','Página inicial com apresentação, serviços e contato.','criar-site.html')}else add(z)},170)}function iniciarVoz(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add('Este navegador não consegue ouvir pelo microfone. Você ainda pode escrever a pergunta e tocar em Ouvir resposta.');return}if(rec){rec.stop();return}rec=new SR();rec.lang='pt-BR';rec.interimResults=false;rec.maxAlternatives=1;mic.classList.add('on');mic.textContent='■';add('Estou ouvindo. Pode falar.');rec.onresult=e=>{i.value=e.results[0][0].transcript;enviar(i.value);i.value=''};rec.onerror=e=>{if(e.error==='not-allowed')add('Para falar comigo, permita o uso do microfone quando o celular perguntar.');else add('Não consegui entender. Tente falar de novo ou escreva a mensagem.')};rec.onend=()=>{rec=null;mic.classList.remove('on');mic.textContent='🎤'};rec.start()}mic.onclick=iniciarVoz;document.querySelector('#form').onsubmit=e=>{e.preventDefault();enviar(i.value);i.value='';i.focus()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>enviar(b.dataset.q));add('Olá! Eu sou a Lumi. Você pode escrever, tocar no microfone para falar comigo ou usar Ouvir resposta para eu ler o texto.');</script>
