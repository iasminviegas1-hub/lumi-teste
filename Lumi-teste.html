<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumi · Criadora IA</title><style>:root{--v:#08754f;--e:#064d3d;--g:#d4af37}*{box-sizing:border-box}body{margin:0;background:#e8f4eb;color:#163a2c;font:16px Arial,sans-serif}.app{max-width:620px;margin:auto;padding:18px 14px 92px}.top{display:flex;justify-content:space-between;font-weight:bold}.tag{background:var(--g);color:white;padding:6px 10px;border-radius:18px;font-size:12px}.hero{display:flex;gap:14px;align-items:center;padding:18px;margin:16px 0;border-radius:22px;background:linear-gradient(135deg,var(--e),var(--v));color:white}.av{font-size:52px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;line-height:1.35}.chat{min-height:315px;display:flex;flex-direction:column;gap:9px}.msg{max-width:91%;padding:12px;border-radius:15px;line-height:1.45;white-space:pre-wrap}.l{background:white;border:1px solid #d4e6da}.u{background:var(--v);color:white;align-self:flex-end}.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.quick button{background:white;border:1px solid #b5d1bf;border-radius:18px;padding:9px 11px;font-weight:bold;color:#163a2c}.hint{font-size:13px;color:#547264}.form{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:11px;background:white;border-top:1px solid #cde0d3}.form input{flex:1;min-width:0;padding:12px;border:1px solid #b5d1bf;border-radius:10px;font-size:16px}.form button{border:0;border-radius:10px;padding:0 16px;background:var(--v);color:white;font-weight:bold}.linkcard{background:#f8fbff;border:1px solid #cfe0f3;border-radius:13px;padding:12px;margin-top:5px;white-space:normal}.linkcard b{display:block;font-size:18px;color:#14558a}.linkcard p{margin:7px 0}.linkcard a{display:inline-block;text-decoration:none;background:#14558a;color:white;border-radius:8px;padding:9px 11px;font-weight:bold}</style><body><main class="app"><header class="top"><b>Lumi · Criadora IA</b><span class="tag">Assistente IA</span></header><section class="hero"><div class="av">👩🏽</div><div><h1>Oi, eu sou a Lumi.</h1><p>Eu crio ideias de sites, portais e aplicativos com link para testar.</p></div></section><section id="chat" class="chat"></section><div class="quick"><button data-q="Crie o Total de Notícias">Criar Total de Notícias</button><button data-q="Crie um aplicativo">Criar aplicativo</button><button data-q="Quem é você e qual a sua idade?">Sobre a Lumi</button><button data-q="Preciso de um conselho">Conselho</button></div><p class="hint">Experimente: Crie um portal de notícias ou Crie um aplicativo de música.</p></main><form class="form" id="form"><input id="input" placeholder="Diga o que quer criar"><button>Enviar</button></form><script>const c=document.querySelector("#chat"),i=document.querySelector("#input"),base="https://htmlpreview.github.io/?https://github.com/iasminviegas1-hub/lumi-teste/blob/main/";function add(t,k){let d=document.createElement("div");d.className="msg "+k;d.textContent=t;c.appendChild(d);window.scrollTo(0,document.body.scrollHeight)}function link(t,desc,file){let d=document.createElement("div");d.className="msg l";d.innerHTML="<div class=linkcard><b>"+t+"</b><p>"+desc+"</p><a target=_blank rel=noopener href=\""+base+file+"\">Abrir projeto criado</a></div>";c.appendChild(d)}function idade(){let dias=Math.max(0,Math.floor((Date.now()-new Date("2026-11-04T00:00:00-03:00"))/86400000));return dias?"Tenho "+dias+" dias de idade.":"Fui criada hoje, então ainda tenho menos de um dia de idade."}function conta(q){let t=q.toLowerCase().replaceAll(",",".");let p=t.match(/(\d+(?:\.\d+)?)\s*%\s*(?:de|do)\s*(\d+(?:\.\d+)?)/);if(p)return+p[1]*+p[2]/100;t=t.replace(/quanto é|qual é|calcule|por favor|\?/g," ").replace(/multiplicado por|vezes| x /g,"*").replace(/dividido por/g,"/").replace(/mais/g,"+").replace(/menos/g,"-").replace(/[^0-9.+*/() -]/g,"");if(!t||!/^[0-9.+*/() -]+$/.test(t))return null;try{let z=Function("return ("+t+")")();return Number.isFinite(z)?z:null}catch(e){return null}}function r(q){let t=q.toLowerCase();if(/total.*notícia|portal.*notícia|site.*notícia/.test(t))return "NOTICIAS";if(/cria.*(aplicativo|app)|quero.*(aplicativo|app)|fazer.*(aplicativo|app)/.test(t))return "APP";if(/quem.*(você|tu)|sua idade|quantos anos|quando.*(criada|nasceu)|criador|idealizador/.test(t))return "Eu sou a Lumi, da Criadora IA. Fui criada em Porto Alegre, Brasil, no dia 4 de novembro de 2026. "+idade()+" A Criadora IA foi criada e idealizada por Douglas Resendeiras.";if(/nome.*(pessoa|amigo|alguém)|dados.*(pessoa|amigo|alguém)|endereço|telefone.*(dele|dela)/.test(t))return "Eu não revelo nem invento dados pessoais de outras pessoas.";if(/conselho|triste|ansioso|ansiosa|briga|problema|ajuda.*vida/.test(t))return "Claro. Me conta com calma o que aconteceu e o que você gostaria que melhorasse. Vou te ajudar a pensar em um passo de cada vez.";if(/ensina.*(ler|leitura)|aprender.*(ler|leitura)|não sei ler/.test(t))return "Vamos sem pressa. CASA é CA + SA. Leia comigo: CA-SA. Quer tentar BOLA agora?";let z=conta(q);if(z!==null)return "A conta dá "+(Number.isInteger(z)?z:String(Math.round(z*100)/100).replace(".",","))+".";return "Entendi. Posso criar um portal de notícias ou um aplicativo com link para você abrir e testar."}function enviar(q){if(!q.trim())return;add(q,"u");setTimeout(()=>{let z=r(q);if(z==="NOTICIAS"){add("Pronto. Criei o modelo do Total de Notícias e já deixei o link para abrir.","l");link("Total de Notícias","Portal para Porto Alegre e região, com alertas, matérias e área de envio.","total-de-noticias.html")}else if(z==="APP"){add("Pronto. Criei um modelo de aplicativo para testar no celular.","l");link("Meu Aplicativo","Tela inicial, área principal, contato e navegação inferior.","aplicativo-criado.html")}else add(z,"l")},150)}document.querySelector("#form").onsubmit=e=>{e.preventDefault();enviar(i.value);i.value="";i.focus()};document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>enviar(b.dataset.q));add("Olá! Eu sou a Lumi. Peça para eu criar o Total de Notícias ou um aplicativo e eu entrego um link para abrir.","l");</script>
