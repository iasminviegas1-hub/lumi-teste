ou ajudar a organizar uma ideia. O que você quer criar?'}function send(q){if(!q.trim())return;add(q,'u');setTimeout(()=>add(answer(q),'l'),150)}$('#form').onsubmit=e=>{e.preventDefault();send($('#input').value);$('#input').value=''};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q));document.querySelectorAll('[data]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data],.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.data).classList.add('on')});$('#build').onclick=()=>{let i=$('#idea').value||'Seu projeto',p=$('#pub').value||'as pessoas que você quer alcançar',s=$('#style').value,o=$('#out');o.textContent='Objetivo: '+i+'\nPúblico: '+p+'\nEstilo: '+s+'\n\nEstrutura: Início, Sobre, Destaques, Galeria e Contato.';o.classList.remove('hide')};add('Olá. Meu nome é Lumi. Pode me contar sua ideia do seu jeito, eu ajudo por partes.','l')</script>
