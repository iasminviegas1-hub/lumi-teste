<!doctype html><html lang='pt-BR'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Lumi · Criadora IA</title><style>*{box-sizing:border-box}body{margin:0;background:#edf7ef;color:#193b2e;font:16px Arial,sans-serif}.app{max-width:650px;margin:auto;padding:16px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;font-weight:bold}.tag{background:#d5af38;color:#fff;border-radius:18px;padding:6px 10px;font-size:12px}.hero{display:flex;gap:12px;align-items:center;margin:15px 0;padding:16px;border-radius:20px;background:#08754f;color:#fff}.avatar{font-size:46px}.hero h1{font-size:24px;margin:0 0 6px}.hero p{margin:0;line-height:1.35}.chat{display:flex;flex-direction:column;gap:10px;min-height:330px}.msg{max-width:92%;padding:12px;border-radius:15px;line-height:1.42;white-space:pre-wrap}.lumi{align-self:flex-start;background:#fff;border:1px solid #cfe1d4}.user{align-self:flex-end;background:#08754f;color:#fff}.read{display:block;margin-top:9px;border:0;border-radius:8px;background:#e3f4e9;color:#075d40;padding:8px 10px;font-weight:bold}.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.quick button{background:#fff;border:1px solid #aacbbb;border-radius:18px;padding:9px 11px;color:#163a2c;font-weight:bold}.note{font-size:13px;color:#536f62}.form{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #cfe1d4;display:flex;gap:7px;padding:10px}.form input{min-width:0;flex:1;padding:12px;border:1px solid #aacbbb;border-radius:10px;font-size:16px}.send,.mic{border:0;border-radius:10px;background:#08754f;color:#fff;font-weight:bold;padding:0 14px}.mic{font-size:22px;min-width:52px}.mic.listening{background:#b52135}</style><body><main class='app'><header class='top'><b>Lumi · Criadora IA</b><span class='tag'>Assistente IA</span></header><section class='hero'><div class='avatar'>👩🏽</div><div><h1>Oi, eu sou a Lumi.</h1><p>Você pode escrever ou falar comigo. Eu também leio minhas respostas.</p></div></section><section id='chat' class='chat'></section><div class='quick'><button data-q='O que você faz?'>O que você faz?</button><button data-q='Me ensine a ler'>Aprender a ler</button><button data-q='Preciso de um conselho'>Conselho</button><button data-q='Quanto é 25 vezes 4?'>Fazer conta</button></div><p class='note'>Limite de 20 perguntas por dia. Depois disso, você volta à meia-noite.</p></main><form id='form' class='form'><button id='mic' class='mic' type='button' aria-label='Falar com a Lumi'>🎤</button><input id='input' placeholder='Escreva ou fale sua pergunta' autocomplete='off'><button class='send'>Enviar</button></form><script>const chat=document.querySelector('#chat'),input=document.querySelector('#input'),mic=document.querySelector('#mic');let reconhecimento=null;function fala(texto){if(!window.speechSynthesis){alert('Este navegador não possui leitura em voz.');return}speechSynthesis.cancel();let voz=new SpeechSynthesisUtterance(texto);voz.lang='pt-BR';voz.rate=.93;speechSynthesis.speak(voz)}function mensagem(texto,quem='lumi',botao=true){let caixa=document.createElement('div');caixa.className='msg '+quem;let textoEl=document.createElement('span');textoEl.textContent=texto;caixa.append(textoEl);if(quem==='lumi'&&botao){let ler=document.createElement('button');ler.className='read';ler.textContent='🔊 Ouvir resposta';ler.onclick=()=>fala(texto);caixa.append(ler)}chat.append(caixa);window.scrollTo(0,document.body.scrollHeight)}function chave(){return 'lumi-perguntas-'+new Date().toLocaleDateString('pt-BR')}function liberado(){try{let hoje=chave(),quantidade=Number(localStorage.getItem(hoje)||0);if(quantidade>=20){mensagem('Você já fez suas 20 perguntas de hoje. Volte amanhã à meia-noite para falar comigo de novo.');return false}localStorage.setItem(hoje,String(quantidade+1));return true}catch(e){return true}}function resposta(pergunta){let p=pergunta.toLowerCase();let conta=p.match(/(\d+)\s*(?:x|vezes|\*)\s*(\d+)/);if(conta)return 'A resposta é '+(Number(conta[1])*Number(conta[2]))+'.';if(/ler|leitura/.test(p))return 'Vamos com calma. CASA se separa em CA-SA. Agora você tenta falar comigo: CA-SA.';if(/conselho|triste|problema|ajuda/.test(p))return 'Pode me contar com calma. Vamos pensar em um passo pequeno que ajude você agora, sem julgamento.';if(/faz|consegue|o que/.test(p))return 'Eu converso, ensino, explico ideias, ajudo com contas e leio minhas respostas em voz alta.';return 'Entendi. Posso conversar, ensinar, explicar, ajudar com uma conta ou organizar sua ideia. Me conta um pouco mais.'}function enviar(texto){texto=texto.trim();if(!texto)return;if(!liberado())return;mensagem(texto,'user',false);setTimeout(()=>mensagem(resposta(texto)),220);input.value=''}function ouvir(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){mensagem('O microfone não é suportado neste navegador. Você ainda pode escrever sua pergunta e usar o botão Ouvir resposta.');return}if(reconhecimento){reconhecimento.stop();return}reconhecimento=new SR();reconhecimento.lang='pt-BR';reconhecimento.interimResults=false;reconhecimento.maxAlternatives=1;mic.classList.add('listening');mic.textContent='■';reconhecimento.onstart=()=>mensagem('Estou ouvindo. Pode falar.');reconhecimento.onresult=e=>enviar(e.results[0][0].transcript);reconhecimento.onerror=e=>{if(e.error==='not-allowed')mensagem('Para falar comigo, permita o microfone quando o celular perguntar.');else mensagem('Não consegui entender. Tente falar de novo ou escreva.')};reconhecimento.onend=()=>{reconhecimento=null;mic.classList.remove('listening');mic.textContent='🎤'};reconhecimento.start()}mic.onclick=ouvir;document.querySelector('#form').onsubmit=e=>{e.preventDefault();enviar(input.value)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>enviar(b.dataset.q));mensagem('Olá! Eu sou a Lumi. Toque no 🎤 para falar comigo ou escreva sua pergunta.');</script>
