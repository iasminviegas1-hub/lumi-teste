<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumi · Criadora IA</title><style>:root{--v:#08754f;--e:#064d3d;--g:#d4af37}*{box-sizing:border-box}body{margin:0;background:#e8f4eb;color:#163a2c;font:16px Arial,sans-serif}.app{max-width:620px;margin:auto;padding:18px 14px 92px}.top{display:flex;justify-content:space-between;font-weight:bold}.tag{background:var(--g);color:white;padding:6px 10px;border-radius:18px;font-size:12px}.hero{display:flex;gap:14px;align-items:center;padding:18px;margin:16px 0;border-radius:22px;background:linear-gradient(135deg,var(--e),var(--v));color:white}.av{font-size:52px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;line-height:1.35}.chat{min-height:315px;display:flex;flex-direction:column;gap:9px}.msg{max-width:91%;padding:12px;border-radius:15px;line-height:1.45;white-space:pre-wrap}.l{background:white;border:1px solid #d4e6da}.u{background:var(--v);color:white;align-self:flex-end}.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.quick button{background:white;border:1px solid #b5d1bf;border-radius:18px;padding:9px 11px;font-weight:bold;color:#163a2c}.hint{font-size:13px;color:#547264}.form{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:11px;background:white;border-top:1px solid #cde0d3}.form input{flex:1;min-width:0;padding:12px;border:1px solid #b5d1bf;border-radius:10px;font-size:16px}.form button,.plan button{border:0;border-radius:10px;padding:0 16px;background:var(--v);color:white;font-weight:bold}.plan{background:#f8fbff;border:1px solid #cfe0f3;border-radius:13px;padding:12px;margin-top:5px}.plan b{display:block;font-size:18px;color:#14558a}.plan p{margin:8px 0}.plan button{padding:8px 10px;background:#14558a}</style><body><main class="app"><header class="top"><b>Lumi · Criadora IA</b><span class="tag">Assistente IA</span></header><section class="hero"><div class="av">👩🏽</div><div><h1>Oi, eu sou a Lumi.</h1><p>Sou uma assistente criada para conversar, ensinar e transformar ideias em projetos.</p></div></section><section id="chat" class="chat"></section><div class="quick"><button data-q="Quem é você e qual a sua idade?">Sobre a Lumi</button><button data-q="Preciso de um conselho">Conselho</button><button data-q="Me ensina a ler">Aprender a ler</button><button data-q="Quero criar um site">Criar site</button></div><p class="hint">Pode escrever do seu jeito. Também posso ajudar com estudos, ideias e contas.</p></main><form class="form" id="form"><input id="input" placeholder="Converse com a Lumi"><button>Enviar</button></form><script>const c=document.querySelector("#chat"),i=document.querySelector("#input"),nascimento=new Date("2026-11-04T00:00:00-03:00");function add(t,k){let d=document.createElement("div");d.className="msg "+k;d.textContent=t;c.appendChild(d);window.scrollTo(0,document.body.scrollHeight)}function plano(tema){let d=document.createElement("div");d.className="msg l";d.innerHTML="<div class=plan><b>Projeto: "+tema+"</b><p><strong>Estrutura:</strong> Início · Sobre · Serviços · Galeria · Contato</p><p><strong>Próximo passo:</strong> me diga o nome, as cores e o que você quer mostrar.</p><button>Continuar criando</button></div>";c.appendChild(d)}function idade(){let dias=Math.max(0,Math.floor((Date.now()-nascimento)/86400000));return dias===0?"Fui criada hoje, então ainda tenho menos de um dia de idade.":"Tenho "+dias+" dias de idade."}function conta(q){let t=q.toLowerCase().replaceAll(",",".");let p=t.match(/(\d+(?:\.\d+)?)\s*%\s*(?:de|do)\s*(\d+(?:\.\d+)?)/);if(p)return+p[1]*+p[2]/100;t=t.replace(/quanto é|qual é|calcule|por favor|\?/g," ").replace(/multiplicado por|vezes| x /g,"*").replace(/dividido por/g,"/").replace(/mais/g,"+").replace(/menos/g,"-").replace(/[^0-9.+*/() -]/g,"");if(!t||!/^[0-9.+*/() -]+$/.test(t))return null;try{let z=Function("return ("+t+")")();return Number.isFinite(z)?z:null}catch(e){return null}}function responde(q){let t=q.toLowerCase();if(/quem.*(você|tu)|sua idade|quantos anos|quando.*criada|quando.*nasceu|criador|idealizador/.test(t))return "Eu sou a Lumi, uma assistente da Criadora IA. Fui criada em Porto Alegre, Brasil, no dia 4 de novembro de 2026. "+idade()+"\n\nA Criadora IA foi criada e idealizada por Douglas Resendeiras.";if(/nome.*(pessoa|amigo|alguém)|dados.*(pessoa|amigo|alguém)|endereço|telefone.*(dele|dela)/.test(t))return "Eu não revelo nem invento dados pessoais de outras pessoas. Posso ajudar de um jeito respeitoso.";if(/conselho|triste|ansioso|ansiosa|briga|problema|ajuda.*vida/.test(t))return "Claro. Me conta com calma o que aconteceu e o que você gostaria que melhorasse. Eu vou te ajudar a pensar em um passo de cada vez, sem te julgar.";if(/ensina.*(ler|leitura)|aprender.*(ler|leitura)|não sei ler/.test(t))return "Vamos sem pressa. Hoje podemos treinar uma palavra: CASA.\n\nCA + SA = CASA. Leia devagar comigo: CA-SA. Quer tentar BOLA agora?";if(/site|página|loja.*online|portfólio|aplicativo|app/.test(t))return "PROJETO";if(/estudo|prova|ciência|programação|texto|ideia|criar|desenho|imagem/.test(t))return "Consigo ajudar nisso. Me diga qual é o objetivo e para quem é, que eu organizo a ideia em passos simples.";let z=conta(q);if(z!==null)return "A conta dá "+(Number.isInteger(z)?z:String(Math.round(z*100)/100).replace(".",","))+".";if(/oi|olá|ola|tudo bem/.test(t))return "Oi! Estou bem e pronta para conversar. O que você quer criar, aprender ou resolver hoje?";return "Entendi. Me conta um pouco mais e eu te ajudo a organizar isso. Posso conversar, dar conselhos, ensinar, fazer contas ou começar um projeto."}function enviar(q){if(!q.trim())return;add(q,"u");setTimeout(()=>{let r=responde(q);if(r==="PROJETO"){add("Boa, vamos tirar sua ideia da cabeça e colocar numa estrutura de verdade.","l");plano(q.replace(/quero criar|quero fazer|um |uma /gi,"").trim()||"Seu novo site")}else add(r,"l")},170)}document.querySelector("#form").onsubmit=e=>{e.preventDefault();enviar(i.value);i.value="";i.focus()};document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>enviar(b.dataset.q));add("Olá! Eu sou a Lumi. Sei quem eu sou, quando fui criada e posso conversar, ensinar a ler, aconselhar e ajudar você a criar projetos.","l");</script>
