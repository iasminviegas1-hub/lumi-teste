<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Lumi · Criadora IA</title><style>body{margin:0;background:#e8f4eb;color:#163a2c;font:16px Arial,sans-serif}.app{max-width:590px;margin:auto;padding:18px 14px 88px}.top{display:flex;justify-content:space-between;font-weight:bold}.tag{background:#d4af37;color:#fff;padding:6px 10px;border-radius:18px;font-size:12px}.hero{display:flex;align-items:center;gap:15px;padding:18px;margin:16px 0;border-radius:22px;background:linear-gradient(135deg,#064d3d,#08754f);color:#fff}.av{width:88px;height:88px;border-radius:50%;background:#e9ba97;border:4px solid #d4af37;position:relative;overflow:hidden;flex:none}.hair{position:absolute;top:-8px;left:1px;right:1px;height:60px;background:#4b2922;border-radius:55%}.face{position:absolute;top:25px;left:17px;width:53px;height:56px;background:#e9ba97;border-radius:48%}.face:before{content:'•  •';position:absolute;top:18px;left:11px;letter-spacing:9px;color:#42221d}.face:after{content:'⌣';position:absolute;top:32px;left:19px;color:#a45252;font-size:23px}h1{font-size:25px;margin:0 0 7px}.hero p{margin:0;line-height:1.35}.chat{min-height:280px;display:flex;flex-direction:column;gap:9px}.msg{max-width:88%;padding:12px;border-radius:15px;line-height:1.4}.l{background:#fff;border:1px solid #d4e6da}.u{background:#08754f;color:#fff;align-self:flex-end}.quick{display:flex;flex-wrap:wrap;gap:7px}.quick button{background:#fff;border:1px solid #b5d1bf;border-radius:18px;padding:9px 11px;font-weight:bold}.hint{font-size:13px;color:#547264}.form{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:11px;background:#fff;border-top:1px solid #cde0d3}.form input{flex:1;min-width:0;padding:12px;border:1px solid #b5d1bf;border-radius:10px;font-size:16px}.form button{border:0;border-radius:10px;padding:0 16px;background:#08754f;color:#fff;font-weight:bold}</style></head><body><main class='app'><header class='top'><b>Lumi · Criadora IA</b><span class='tag'>Assistente IA</span></header><section class='hero'><div class='av'><i class='hair'></i><i class='face'></i></div><div><h1>Oi, eu sou a Lumi.</h1><p>Posso conversar, ensinar e fazer continhas com você.</p></div></section><section id='chat' class='chat'></section><div class='quick'><button data-q='Quanto é 25 vezes 4?'>25 × 4</button><button data-q='Quanto é 20% de 150?'>20% de 150</button><button data-q='Você consegue fazer continha?'>Perguntar à Lumi</button></div><p class='hint'>Tente: 27 + 15, 8 vezes 6, 100 dividido por 4 ou 20% de 150.</p></main><form class='form' id='form'><input id='input' placeholder='Pergunte ou escreva uma conta'><button type='submit'>Enviar</button></form><script>var chat=document.getElementById('chat'),input=document.getElementById('input');function add(text,kind){var m=document.createElement('div');m.className='msg '+kind;m.textContent=text;chat.appendChild(m)}function calcular(texto){var t=texto.toLowerCase().replaceAll(',','.');var p=t.match(/(\d+(?:\.\d+)?)\s*%\s*(?:de|do)\s*(\d+(?:\.\d+)?)/);if(p){return Number(p[1])*Number(p[2])/100}t=t.replace(/quanto é|qual é|calcule|por favor|\?/g,' ').replace(/multiplicado por|vezes| x /g,'*').replace(/dividido por/g,'/').replace(/mais/g,'+').replace(/menos/g,'-').replace(/[^0-9.+*/() -]/g,'');if(!t||!/^[0-9.+*/() -]+$/.test(t)){return null}try{var n=Function('return ('+t+')')();return Number.isFinite(n)?n:null}catch(e){return null}}function responder(texto){var pergunta=texto.toLowerCase();if(/consegue.*(conta|continhas|matemática)|faz.*(conta|continhas|matemática)/.test(pergunta)){return 'Sim, consigo fazer continhas. Pode mandar uma soma, multiplicação, divisão ou porcentagem.'}var n=calcular(texto);if(n!==null){return 'A conta dá '+(Number.isInteger(n)?n:String(Math.round(n*100)/100).replace('.',','))+'.'}return 'Ainda estou aprendendo a conversar, mas já consigo fazer contas. Escreva, por exemplo: 27 + 15 ou 20% de 150.'}function enviar(texto){if(!texto.trim()){return}add(texto,'u');setTimeout(function(){add(responder(texto),'l')},120)}document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();enviar(input.value);input.value='';input.focus()});document.querySelectorAll('[data-q]').forEach(function(b){b.addEventListener('click',function(){enviar(b.dataset.q)})});add('Olá. Pergunte se eu sei fazer continhas ou mande uma conta para eu resolver.','l')</script></body></html>
