<!doctype html><html lang=pt-BR><meta charset=utf-8><meta name=viewport content=width=device-width,initial-scale=1><title>Lumi</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:rgb(16,5,30);color:white;font-family:Arial,sans-serif}.app{max-width:680px;margin:auto;padding:22px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;font-weight:bold}.tag{border:1px solid rgb(130,100,180);padding:7px 10px;border-radius:18px;font-size:12px}.hero,.chat{background:rgb(35,16,63);border:1px solid rgb(100,75,140);border-radius:24px}.hero{text-align:center;padding:20px;margin:18px 0}.avatar{width:124px;height:124px;margin:auto;animation:girar 5s linear infinite;filter:drop-shadow(0 0 14px rgb(85,220,255))}@keyframes girar{to{transform:rotate(360deg)}}h1{margin:9px 0;font-size:26px}p{color:rgb(220,205,240);line-height:1.45}.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.quick button,.send{background:rgb(73,45,125);color:white;border:1px solid rgb(160,130,225);border-radius:18px;padding:10px 12px;font-weight:bold}.chat{padding:14px;min-height:250px}.msg{max-width:88%;padding:12px;border-radius:16px;background:rgb(57,38,89);line-height:1.45}.form{position:fixed;bottom:0;left:0;right:0;padding:12px;display:flex;gap:8px;background:rgb(16,5,30)}input{flex:1;border:1px solid rgb(150,115,210);background:rgb(40,18,68);border-radius:16px;color:white;padding:14px;font-size:16px}.send{border:0;background:rgb(87,150,240)}</style><main class=app><header class=top><span>✦ Lumi</span><span class=tag>IA criadora</span></header><section class=hero><svg class=avatar viewBox=0 0 180 180 xmlns=http://www.w3.org/2000/svg><circle cx=90 cy=90 r=65 fill=rgb(48,39,175)/><path d=M8,96c36,42,128,42,164,0 fill=none stroke=rgb(40,220,255) stroke-width=12/><circle cx=63 cy=82 r=10 fill=white/><circle cx=117 cy=82 r=10 fill=white/><path d=M68,112q22,22,44,0 fill=none stroke=white stroke-width=8 stroke-linecap=round/></svg><h1>Oi, eu sou a
