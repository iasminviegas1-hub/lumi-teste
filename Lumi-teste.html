<!doctype html><html lang='pt-BR'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Lumi</title><style>body{margin:0;background:#e8f4eb;color:#163a2c;font:16px Arial}.app{max-width:590px;margin:auto;padding:18px 14px 85px}.top{display:flex;justify-content:space-between;font-weight:bold}.tag{background:#d4af37;color:white;border-radius:20px;padding:6px 10px;font-size:12px}.hero{margin:16px 0;padding:18px;border-radius:22px;background:#08754f;color:white;display:flex;gap:14px;align-items:center}.av{width:88px;height:88px;border-radius:50%;background:#e8bb98;border:4px solid #d4af37;position:relative;overflow:hidden;flex:none}.hair{position:absolute;inset:-8px 1px 36px;background:#4b2922;border-radius:55% 55% 35% 35%}.face{position:absolute;left:18px;top:25px;width:53px;height:56px;border-radius:45%;background:#e8bb98}.face:before{content:'•  •';position:absolute;top:19px;left:11px;color:#3c211b;letter-spacing:8px}.face:after{content:'⌣';position:absolute;top:32px;left:19px;color:#ad5f5f;font-size:22px}h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;line-height:1.4}.chat{display:flex;flex-direction:column;gap:9px;min-height:270px}.msg{padding:12px;border-radius:15px;max-width:87%;line-height:1.4}.l{background:white}.u{background:#08754f;color:white;align-self:end}.quick{display:flex;gap:7px;flex-wrap:wrap}.quick button{background:white;border:1px solid #b5d1bf;border-radius:18px;padding:9px;font-weight:bold}.hint{font-size:13px;color:#547264}.form{position:fixed;bottom:0;left:0;right:0;padding:11px;background:white;display:flex;gap:8px;border-top:1px solid #cde0d3}.form input{flex:1;padding:12px;border:1px solid #b5d1bf;border-radius:10px;font-size:16px}.form button{background:#08754f;color:white;border:0;border-radius:10px;padding:0 15px;font-weight:bold}</style><main class='app'><header class='top'><b>Lumi · Criadora IA</b><span class='tag'>Assistente IA</span></header><section class='hero'><div class='av'><i class='hair'></i><i class='face'></i></div><div><h1>Oi, eu sou a Lumi.</h1><p>Posso conversar, ensinar e fazer continhas com você.</p></div></section><section id='chatbox' class='chat'></section><div class='quick'><button data-q='Quanto é 25 vezes 4?'>25 × 4</button><button data-q='Quanto é 20% de 150?'>20% de 150</button><button data-q='100 dividido por 4'>100 ÷ 4</button></div><p class='hint'>Exemplos: 27 + 15, 8 vezes 6, 100 dividido por 4 ou 20% de 150.</p></main><form class='form' id='form'><input id='input' placeholder='Escreva uma mensagem ou uma conta'><button>Enviar</button></form><script>const $=x=>document.querySelector(x),box=$('#chatbox');function add(t,c){let d=document.createElement('div');d.className=`msg ${c}`;d.textContent=t;box.append(d)}function conta(q){let t=q.toLowerCase().replace(/quanto é|qual é|calcule|por favor|\?/g,` `).replaceAll(`,`,`.`);let p=t.match(/(\d+(?:\.\d+)?)\s*%\s*(?:de|do)\s*(\d+(?:\.\d+)?)/);if(p)return+p[1]*+p[2]/100;t=t.replace(/vezes|multiplicado por| x /g,`*`).replace(/dividido por/g,`/`).replace(/mais/g,`+`).replace(/menos/g,`-`).replace(/[^0-9.+*/() -]/g,``);if(!t||!/^[0-9.+*/() -]+$/.test(t))return null;try{let n=Function(`return (${t})`)();return Number.isFinite(n)?n:null}catch(e){return null}}function responde(q){let n=conta(q);if(n!==null)return `A conta dá ${Number.isInteger(n)?n:Math.round(n*100)/100}.`;return `Eu consigo fazer contas. Tente escrever 27 + 15, 8 vezes 6 ou 20% de 150.`}function enviar(q){if(!q.trim())return;add(q,`u`);setTimeout(()=>add(responde(q),`l`),120)}$('#form').onsubmit=e=>{e.preventDefault();enviar($('#input').value);$('#input').value=``};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>enviar(b.dataset.q));add(`Olá. Pode me mandar uma conta, por exemplo: quanto é 25 vezes 4?`,`l`)</script>
