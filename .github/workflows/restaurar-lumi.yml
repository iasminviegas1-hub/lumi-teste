name: Restaurar visual anterior da Lumi
on:
  push:
    paths:
      - .restore-lumi-trigger
permissions:
  contents: write
jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar visual anterior
        run: |
          git show 6c7f3b64c8d504323f1bd6cdcc0dcfd81f8a9b16:Lumi-teste.html > Lumi-teste.html
          git config user.name "Proteção da Lumi"
          git config user.email "actions@github.com"
          git add Lumi-teste.html
          git diff --cached --quiet || git commit -m "Restaura visual anterior da Lumi"
          git push
