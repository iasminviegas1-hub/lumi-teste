name: Ativar avatar da Lumi\non:\n  push:\n    paths:\n      - '.github/workflows/ativar-avatar.yml'\npermissions:\n  contents: write\njobs:\n  corrigir:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Usar recurso público\n        run: |\n          python - <<'PY'\n          from pathlib import Path\n          p = Path('Lumi-teste.html')\n          s = p.read_text()\n          s = s.replace('src="lumi-recursos.js"', 'src="https://raw.githubusercontent.com/iasminviegas1-hub/lumi-teste/main/lumi-recursos.js"')\n          p.write_text(s)\n          PY\n      - name: Salvar\n        run: |\n          git config user.name 'Lumi atualização'\n          git config user.email 'actions@github.com'\n          git add Lumi-teste.html\n          git diff --cached --quiet || git commit -m 'Carregar avatar da Lumi corretamente'\n          git push