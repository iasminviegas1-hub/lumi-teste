name: Proteger link fixo da Lumi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  manter-endereco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Confere o endereco oficial
        run: |
          test -f Lumi-teste.html
          test -s Lumi-teste.html
          test -f LINK-OFICIAL.md
          grep -Fqx "ARQUIVO_OFICIAL=Lumi-teste.html" LINK-OFICIAL.md
          grep -Fqx "RAMO_OFICIAL=main" LINK-OFICIAL.md
          echo "OK: o arquivo oficial continua no mesmo endereco."
      - name: Bloqueia mudanca de caminho em pedidos de alteracao
        if: github.event_name == "pull_request"
        run: |
          git diff --name-status origin/${{ github.base_ref }}...HEAD > mudancas.txt
          if grep -E "^[DR].*Lumi-teste.html|^[R].*Lumi-teste.html" mudancas.txt; then
            echo "ERRO: Lumi-teste.html nao pode ser apagado, movido ou renomeado."
            exit 1
          fi
